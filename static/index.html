    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5ede4" id="theme-color">
    <title>fin</title>
    <!-- The theme before first paint: light, dark, or the device's (fin-theme). -->
    <script>
    (function () {
        var c = 'system';
        try { c = localStorage.getItem('fin-theme') || 'system'; } catch (e) {}
        if (c !== 'light' && c !== 'dark') c = 'system';
        var dark = c === 'dark' || (c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.setAttribute('data-theme', dark ? 'dark' : 'light');
        r.setAttribute('data-theme-choice', c);
        var m = document.getElementById('theme-color'); if (m) m.setAttribute('content', dark ? '#17130f' : '#f5ede4');
    })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

        <header class="topbar">
            <a class="brand-lockup" href="#/" aria-label="fin, home">

            </nav>
            <div class="topbar-end">
                <a class="write-pill" id="write-pill" href="#/changes" title="Whether Claude may write to fin from chat">

                </a>
                <div class="theme" id="theme">
                    <button type="button" class="theme-btn" id="theme-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" aria-label="Theme: Match my device">
                        <svg class="ic-light" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><use href="#ph-sun"/></svg>
                        <svg class="ic-dark" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><use href="#ph-moon"/></svg>
                        <svg class="ic-system" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><use href="#ph-monitor"/></svg>
                    </button>
                    <div class="menu" id="theme-menu" role="menu" aria-label="Theme" hidden>
                        <button type="button" role="menuitemradio" data-theme-choice="light" aria-checked="false" tabindex="-1"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><use href="#ph-sun"/></svg>Light</button>
                        <button type="button" role="menuitemradio" data-theme-choice="dark" aria-checked="false" tabindex="-1"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><use href="#ph-moon"/></svg>Dark</button>
                        <button type="button" role="menuitemradio" data-theme-choice="system" aria-checked="false" tabindex="-1"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><use href="#ph-monitor"/></svg>Match my device</button>
                    </div>
                </div>
            </div>
        </header>

        <div id="banners"></div>

        <main id="view" tabindex="-1">
            <div class="loading">Loading…</div>
        </main>
    </div>
