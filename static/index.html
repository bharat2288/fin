<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5ede4">
    <title>fin</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#/" aria-label="fin, home">
            <span class="brand-mark" aria-hidden="true">f</span>
            <span class="brand-name">fin</span>
        </a>
        <nav class="places" aria-label="Places">
            <a class="place" href="#/" data-place="home">Home</a>
            <a class="place" href="#/queue" data-place="queue">Queue <span class="count" data-count="queue"></span></a>
            <a class="place" href="#/books" data-place="books">Books</a>
            <a class="place" href="#/changes" data-place="changes">Changes <span class="count claude" data-count="claude"></span></a>
        </nav>
        <div class="topbar-end">
            <a class="write-pill" id="write-pill" href="#/changes" title="Whether Claude may write to fin from chat">
                <span class="dot" aria-hidden="true"></span><span>Claude may write: <b data-write-state>…</b></span>
            </a>
        </div>
    </header>

    <main id="view" tabindex="-1">
        <div class="loading">Loading…</div>
    </main>

    <nav class="tabbar" aria-label="Places">
        <a href="#/" data-place="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
            Home
        </a>
        <a href="#/queue" data-place="queue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            Queue <span class="count" data-count="queue"></span>
        </a>
        <a href="#/books" data-place="books">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h6a2 2 0 012 2v14a2 2 0 00-2-2H4z"/><path d="M20 4h-6a2 2 0 00-2 2v14a2 2 0 012-2h6z"/></svg>
            Books
        </a>
        <a href="#/changes" data-place="changes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg>
            Changes <span class="count claude" data-count="claude"></span>
        </a>
    </nav>

    <div id="sheets"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="/static/chart.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
